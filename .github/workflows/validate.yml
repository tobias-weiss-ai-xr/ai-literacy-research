name: Validate Papers

on:
  push:
    branches: [main]
    paths:
      - 'papers.yaml'
      - 'scripts/'
      - 'tools/'
      - 'requirements.txt'
      - 'config/taxonomy.yaml'
      - 'config/concepts.yaml'
      - 'concepts.json'
      - 'concept_graph.json'
      - 'docs/research/gap_analysis.md'
      - 'docs/research/concept_map.md'
  pull_request:
    paths:
      - 'papers.yaml'
      - 'scripts/'
      - 'tools/'
      - 'requirements.txt'
      - 'config/taxonomy.yaml'
      - 'config/concepts.yaml'
      - 'concepts.json'
      - 'concept_graph.json'
      - 'docs/research/gap_analysis.md'
      - 'docs/research/concept_map.md'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, ai-literacy]
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-validate-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ponytail: no setup-python on self-hosted Arch (no prebuilt 3.11 toolchain);
      # system python3 + job-local venv. Revisit when a ci-host runner serves this repo.
      - name: Set up Python venv
        run: rm -rf .venv && python3 -m venv .venv && .venv/bin/pip install --quiet pyyaml requests

      - name: Validate papers.yaml
        run: .venv/bin/python3 scripts/validate_papers.py

      - name: Check README is up-to-date
        run: grep -q '## 📊 Corpus Statistics' README.md || exit 1

      - name: Check concept graph is up-to-date
        run: |
          .venv/bin/python3 tools/extract_concepts.py --papers papers.yaml --out concepts.json
          .venv/bin/python3 tools/relate_concepts.py --papers papers.yaml --concepts concepts.json --write-doc > concept_graph.json
          .venv/bin/python3 tools/analyze_concept_graph.py --graph concept_graph.json --write-doc > concept_graph_analysis.json
          git diff --exit-code -- concepts.json concept_graph.json concept_graph_analysis.json docs/research/concept_map.md docs/research/concept_graph_analysis.md \
            || { echo 'Concept graph is out of date — regenerate (tools/extract_concepts.py + tools/relate_concepts.py + tools/analyze_concept_graph.py)'; exit 1; }

      - name: Check gap analysis is up-to-date
        run: |
          .venv/bin/python3 tools/research_gap_analyzer.py --write-doc
          git diff --exit-code -- docs/research/gap_analysis.md \
            || { echo 'docs/research/gap_analysis.md is out of date — regenerate and commit it (tools/research_gap_analyzer.py)'; exit 1; }

  discover:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, ai-literacy]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # ponytail: no setup-python on self-hosted Arch (no prebuilt 3.11 toolchain);
      # system python3 + job-local venv. Revisit when a ci-host runner serves this repo.
      - name: Set up Python venv
        run: rm -rf .venv && python3 -m venv .venv && .venv/bin/pip install --quiet pyyaml requests

      - name: Discover new papers from arXiv
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/python3 scripts/fetch/fetch_new_papers.py --months 1 --sleep 3 --create-pr

  refresh:
    if: github.event_name == 'schedule'
    runs-on: [self-hosted, linux, ai-literacy]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ponytail: no setup-python on self-hosted Arch (no prebuilt 3.11 toolchain);
      # system python3 + job-local venv. Revisit when a ci-host runner serves this repo.
      - name: Set up Python venv
        run: rm -rf .venv && python3 -m venv .venv && .venv/bin/pip install --quiet pyyaml requests matplotlib

      - name: Regenerate statistics, charts, gap analysis and README
        run: |
          .venv/bin/python3 scripts/analysis/generate_analysis.py
          .venv/bin/python3 scripts/visualize_statistics.py
          .venv/bin/python3 tools/extract_concepts.py --papers papers.yaml --out concepts.json
          .venv/bin/python3 tools/relate_concepts.py --papers papers.yaml --concepts concepts.json --write-doc > concept_graph.json
          .venv/bin/python3 tools/analyze_concept_graph.py --graph concept_graph.json --write-doc > concept_graph_analysis.json
          .venv/bin/python3 tools/research_gap_analyzer.py --write-doc
          .venv/bin/python3 scripts/refresh_readme_stats.py
          .venv/bin/python3 tools/topic_planner.py --top 10

      - name: Commit updates
        run: |
          git config user.name "ai-literacy-research bot"
          git config user.email "bot@tobias-weiss.org"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh statistics, charts and topics"
          git push
