name: Verify Sources

# Repo-agnostic link-liveness audit for the paper corpus (papers.yaml).
# Two-stage verifier (scripts/verify_sources.py): HTTP check + optional
# Playwright recheck of uncertain URLs. Catches definitively-dead links
# (404/410/5xx/connection errors); 403/Cloudflare bot-blocks are warnings.
#
# Fails the run on definitively-dead links (404/410/400, 5xx-after-retry
# except 503, DNS failures). Anti-bot armor (401/403/405/406/418), rate-limits
# (429/503) and connection drops are warnings, not failures.

on:
  schedule:
    - cron: '30 7 * * 1'          # Monday 07:30 UTC — weekly link audit
  workflow_dispatch:
  push:
    paths:
      - 'papers.yaml'
      - 'repos.yaml'
      - 'scripts/verify_sources.py'
      - 'verify-sources.yaml'
      - '.github/workflows/verify-sources.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, ai-literacy]
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-verify-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ponytail: no setup-python on self-hosted Arch (no prebuilt 3.11 toolchain);
      # system python3 + job-local venv. Revisit when a ci-host runner serves this repo.
      - name: Set up Python venv
        run: rm -rf .venv && python3 -m venv .venv && .venv/bin/pip install --quiet pyyaml requests

      - name: Verify paper links (fail on definitively-dead links)
        run: .venv/bin/python3 scripts/verify_sources.py verify-sources.yaml --fail --no-fail-early

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-sources-report
          path: verify-sources-report.json
