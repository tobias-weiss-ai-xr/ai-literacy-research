schema: intent-driven

# Project context — read by every agent working in this repo
context: |
  Repo type: Research corpus (living systematic review).
  Source of truth: papers.yaml (one structured entry per paper).
  Everything else (README.md, statistics.json, docs/papers.json, docs/research/*.md,
  assets/visualizations/*.png) is GENERATED by the pipeline — never edit by hand.
  Config: config/taxonomy.yaml (topic, categories, subcategories, discovery queries).
  Pipeline: scripts/validate_papers.py → scripts/generate_readme.py
            → scripts/standard_stats.py → scripts/analysis/generate_reports.py
            → scripts/visualize_statistics.py
  Discovery sources: arXiv (fetch_new_papers.py), OpenAlex (fetch_openalex_bulk.py),
            dblp/crossref/europepmc (fetch_other_sources.py), GitHub/GitLab/Codeberg repos.
  CI (.github/workflows/validate.yml): validates + regenerates on every push;
            weekly scheduled job discovers new papers and opens a PR.
  Agent contract: AGENTS.md — agents must re-run the full pipeline after any
            papers.yaml change and must never edit generated files.

rules:
  spec:
    - Use behavior-style specs (SHALL/MUST/SHOULD + Given/When/Then scenarios)
    - Every requirement MUST reference the pipeline file that implements it
    - Taxonomy values (categories, subcategories) MUST come from config/taxonomy.yaml
  proposal:
    - State the research workflow gap being closed
    - Reference the relevant research question (RQ1–RQ5) from docs/research/RESEARCH_PLAN.md
      when the change advances a research goal
  design:
    - Prefer extending existing scripts/tools over adding new top-level tools
    - All generated artifacts MUST be reproducible from papers.yaml + taxonomy.yaml alone
  adr:
    - Record data-source or taxonomy decisions that affect corpus comparability
